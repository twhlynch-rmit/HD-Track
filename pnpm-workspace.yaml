packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.5'
  # whole bunch of CVEs. force them all to the patched versions.
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'
  source-map-js: '^1.2.2'
  proxy-addr: '^2.0.8'
  '@grpc/grpc-js': '^1.14.5'
  '@fastify/busboy': '^3.2.1'
  tinypool: '^2.1.2'
  'brace-expansion@^1': '1.1.21'
  'brace-expansion@^2': '2.1.7'
  'brace-expansion@^5': '5.0.12'
  # body-parser DoS (GHSA-27r3-jxmh-p828) — patched in both majors.
  # Express 5 uses 2.x; firebase-functions' Express 4 uses 1.x.
  'body-parser@^1': '1.20.9'
  'body-parser@^2': '2.4.0'
  # Vite dev-server advisories (GHSA-587h-7wmj-h5pm and friends) — dev-only.
  vite: '^7.3.7'
  # eslint-config-next's peer still resolves zod 3; force the patched major.
  # zod-validation-error (the only consumer) supports ^3.25 || ^4.
  zod: '^4.6.6'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
